name: Sync Works Data

on:
  push:
    paths:
      - "content/works/**"
      - "scripts/build-works.mjs"
      - ".github/workflows/sync-works.yml"
  workflow_dispatch:

concurrency:
  group: sync-works-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and validate Works data
        run: node scripts/build-works.mjs
      - name: Commit generated website data when changed
        run: |
          if git diff --quiet -- data/works.js; then
            echo "Generated Works data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/works.js
          git commit -m "chore: sync generated Works data [skip ci]"
          git push
