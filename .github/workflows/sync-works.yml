name: Build and Deploy Portfolio

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/works.js"
      - "content/works/**"
      - "scripts/build-works.mjs"
      - ".pages.yml"
      - ".github/workflows/sync-works.yml"
      - "투명화/**"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "data/works.js"
      - "content/works/**"
      - "scripts/build-works.mjs"
      - ".pages.yml"
      - ".github/workflows/sync-works.yml"
  workflow_dispatch:

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate CMS Works and generate website data
        run: node scripts/build-works.mjs
      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R data _site/data
          cp -R "투명화" _site/투명화
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
